<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgSurface" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="borderSubtle" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="accentRing" x1="340" y1="120" x2="408" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Minimalist Mat Obsidyen Gövde -->
  <rect width="512" height="512" rx="116" fill="url(#bgSurface)" />
  <rect x="20" y="20" width="472" height="472" rx="98" stroke="url(#borderSubtle)" stroke-width="2" />

  <!-- Editorial Yüksek Kontrastlı "N" Monogramı (Didone / Bodoni Oranları) -->
  <!-- Sol İnce Dikey Sütun & Serif Ayakları -->
  <path
    d="M140 156H188V168H172V344H196V356H132V344H154V168H140V156Z"
    fill="#F8FAFC"
  />

  <!-- Sağ İnce Dikey Sütun & Üst Serif -->
  <path
    d="M300 156H364V168H342V356H324V168H300V156Z"
    fill="#F8FAFC"
  />

  <!-- Kaligrafik Keskin Diyagonal Gövde -->
  <path
    d="M158 156H192L342 356H308L158 156Z"
    fill="#F8FAFC"
  />

  <!-- "N°" — Nüans Derece Halkası (Entelektüel Vurgu) -->
  <circle
    cx="382"
    cy="148"
    r="22"
    stroke="url(#accentRing)"
    stroke-width="10"
  />
</svg>
